version: 2.1

jobs:
  # Say Hello Job
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say Hello"
          command: "echo Hello, World!"

  # SonarQube Analysis Job
  sonar_analysis:
    docker:
      - image: cimg/openjdk:17.0  # Ensure Java 17 is used
    steps:
      - checkout
      - run:
          name: Install SonarQube Scanner
          command: |
            wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.6.2.2472-linux.zip
            unzip sonar-scanner-cli-4.6.2.2472-linux.zip
            export PATH=$(pwd)/sonar-scanner-4.6.2.2472-linux/bin:$PATH
            echo $PATH
            ./sonar-scanner-4.6.2.2472-linux/bin/sonar-scanner --version
      - run:
          name: Run SonarQube Scanner
          command: |
            ./sonar-scanner-4.6.2.2472-linux/bin/sonar-scanner \
              -Dsonar.projectKey=your_project_key \
              -Dsonar.sources=. \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN || echo "SonarQube analysis failed, continuing..."

workflows:
  version: 2
  main-workflow:
    jobs:
      - say-hello
      - sonar_analysis:
          requires:
            - say-hello
